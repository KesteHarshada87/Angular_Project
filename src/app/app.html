<h1>🎡 Random Name Picker</h1>

<input [(ngModel)]="newName" placeholder="Enter name" />
<button (click)="addName()">Add</button>

<hr>

<h3>Names List</h3>
<ul>
  <li *ngFor="let name of names">{{name}}</li>
</ul>

<hr>

<button (click)="pickRandom()">SPIN 🎡</button>

<h2 *ngIf="selectedName">
  Winner: {{selectedName}}
</h2>
